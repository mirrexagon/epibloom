[package]
name = "epibloom"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.7"
log = "0.4.26"
serde_json = "1.0.85"
etcetera = "0.10.0"
thiserror = "2"
sse-stream = "0.1.3"
futures = "0.3.31"

[dependencies.rocket]
version = "0.5.1"
features = [ "json", "uuid" ]

[dependencies.uuid]
version = "1.16.0"
features = [ "v4", "serde" ]

[dependencies.serde]
version = "1.0.145"
features = [ "derive" ]

[dependencies.time]
version = "0.3.39"
features = [ "formatting", "local-offset", "serde" ]

[dependencies.reqwest]
version= "0.12.14"
features = [ "json", "stream" ]

[dependencies.rusqlite]
version = "0.34.0"
features = [ "bundled", "uuid" ]

[dependencies.schemars]
version = "0.8.22"
features = [ "preserve_order", "uuid" ]
