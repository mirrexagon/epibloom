[package]
name = "epibloom"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15.7"
env_logger = "0.11.9"
log = "0.4.29"
serde_json = "1.0.149"
etcetera = "0.11.0"
thiserror = "2"
sse-stream = "0.2.1"
futures = "0.3.31"
async-stream = "0.3.6"
lazy_static = "1.5.0"
json-patch = "4.1.0"
glob = "0.3.3"
serde_with = "3.21.0"

[dependencies.tokio]
version = "1.49.0"
features = ["full"]

[dependencies.rocket]
version = "0.5.1"
features = ["json", "uuid"]

[dependencies.uuid]
version = "1.20.0"
features = ["v4", "v7", "serde"]

[dependencies.serde]
version = "1.0.228"
features = ["derive"]

[dependencies.time]
version = "0.3.47"
features = ["formatting", "local-offset", "serde"]

[dependencies.reqwest]
version = "0.13.2"
features = ["json", "stream"]

[dependencies.schemars]
version = "1.2.1"
features = ["preserve_order", "uuid1"]

[dependencies.utoipa]
version = "5.4.0"
features = [
    "uuid",
    "time",
    "rocket_extras",
    "preserve_order",
    "preserve_path_order",
]

[dependencies.utoipa-swagger-ui]
version = "9.0.2"
features = ["rocket"]

[dependencies.mlua]
version = "0.11.6"
features = ["lua55", "vendored", "send", "async", "serde", "macros"]
